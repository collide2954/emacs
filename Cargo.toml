[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.14"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
emacs-core = { path = "crates/emacs-core" }
emacs-charsets = { path = "crates/emacs-charsets" }
flate2 = "1"
regex = "1"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
jiff = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
