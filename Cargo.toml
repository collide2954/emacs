[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.56"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
emacs-core = { path = "crates/emacs-core" }
emacs-charsets = { path = "crates/emacs-charsets" }
emacs-unidata = { path = "crates/emacs-unidata" }
emacs-w32 = { path = "crates/emacs-w32" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }
flate2 = "1"
regex = "1"
iced = { version = "0.14", features = ["canvas", "image", "tokio"] }
tiny-skia = "0.11"
cosmic-text = "0.15"
swash = "0.2"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
jiff = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
